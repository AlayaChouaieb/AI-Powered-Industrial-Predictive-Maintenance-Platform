services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: motorguard
      POSTGRES_USER: motorguard
      POSTGRES_PASSWORD: motorguard_dev
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U motorguard -d motorguard"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://motorguard:motorguard_dev@db:5432/motorguard
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
